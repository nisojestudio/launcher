# Provider: tiktools (recommended), euler (community), or direct (unofficial TikTokLive fallback).
connection_mode: tiktools

connection:
  username: ""
  room_id: ""
  # Do not commit credentials. The panel passes this at launch, or set
  # LIVEPANEL_BRIDGE_API_KEY for any provider (tiktools, euler).
  # Legacy: LIVEPANEL_TIKTOOLS_API_KEY still works for tiktools.
  api_key: ""
  connect_timeout_sec: 20
  heartbeat_interval_sec: 15
  heartbeat_warning_after_sec: 60
  silence_timeout_sec: 0
  # Si la sesion sigue abierta pero pasan estos segundos sin ningun evento,
  # se cierra y se reconecta (socket a medias / proveedor sin eventos).
  # 0 = desactivado. El aviso previo (silence_timeout_sec) sigue siendo 120s.
  silence_reconnect_sec: 300

retry_policy:
  enabled: true
  base_delay_sec: 2
  max_delay_sec: 45
  not_live_delay_sec: 20
  # 0 = sin tope de intentos: los guardias reales son el presupuesto diario y
  # el tope de reconexiones por hora, que esperan en vez de rendirse.
  max_attempts: 0
  max_reconnect_per_hour: 10
  jitter_sec: 1.0
  # Tiempo maximo esperando a que la cuenta empiece el vivo (0 = sin limite).
  waiting_for_live_max_minutes: 30
  # Presupuesto diario de aperturas contra el proveedor (UTC). 0 = sin tope.
  # 50/dia = 10 para el operador + 40 para reconexiones (caidas, silencio,
  # espera del vivo). Cuando se acaba, el bridge para con un mensaje claro en
  # lugar de quemar la cuota restante.
  daily_connection_budget: 50
  daily_manual_reserve: 10
  # Contador diario entre reinicios del panel. Vacio = solo en memoria.
  daily_budget_state_path: tools/bridge_py/logs/connection_budget.json

buffer:
  size: 8192
  batch_size: 64
  overflow_policy: drop_oldest

output:
    panel_ws_url: ws://127.0.0.1:8765
    output_jsonl: ""
    inbox_dir: ""
    session_name: tiktok-live
    broadcast_ws_enabled: true
    broadcast_ws_host: 127.0.0.1
    broadcast_ws_port: 8766
    control_host: 127.0.0.1
    control_port: 8770
    auto_emit_session_status: true

replay:
  enabled: false
  jsonl_path: ""
  preserve_timing: true
  speed: 1.0
  loop: false

logging:
  level: INFO
  log_path: tools/bridge_py/logs/bridge.jsonl

sound_alerts:
  # Alertas sonoras en los cambios de estado de conexion (conectar/desconectar/
  # reconectar). enabled=false las desactiva por completo.
  enabled: true
  # require_panel=true (por defecto) las silencia cuando el panel no esta
  # conectado: la alerta avisa al operador que mira el panel, asi que sin panel
  # no hay destinatario. Ponlo en false para recuperar el aviso incondicional
  # (era el comportamiento anterior, que pitaba con el panel cerrado).
  require_panel: true

legacy_bridge_root: ""
max_events: 0
max_seconds: 0
