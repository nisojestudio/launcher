<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Live Timer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent !important;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.6);
}
#title {
  font-size: 48px;
  margin-bottom: 8px;
  text-align: center;
}
#counter {
  font-size: 120px;
  font-weight: bold;
  font-family: 'Segoe UI', monospace;
  text-align: center;
  line-height: 1.1;
  transition: color 0.3s ease;
}
#counter.warning { color: #ff8c00 !important; }
#counter.danger {
  color: #ff4444 !important;
  animation: pulse 0.5s ease-in-out infinite;
}
#counter.completed {
  color: #ff4444 !important;
  animation: pulse 0.3s ease-in-out infinite;
}
#subtitle {
  font-size: 32px;
  margin-top: 8px;
  text-align: center;
}
@keyframes pulse {
  50% { transform: scale(1.05); }
}
.event-popup {
  position: fixed;
  left: 0;
  right: 0;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 0 15px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
  opacity: 1;
  animation: none;
  pointer-events: none;
  z-index: 50;
}
.event-popup.add { color: #00AAFF; }
.event-popup.subtract { color: #FF4444; }
.event-popup.fade {
  animation: popFade 3s ease-out forwards;
}
@keyframes popFade {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.9); }
}
#completed-banner {
  display: none;
  font-weight: bold;
  text-align: center;
  margin-top: 16px;
  animation: pulse 0.6s ease-in-out infinite;
}
#completed-banner.visible { display: block; }
</style>
</head>
<body>
<div id="title"></div>
<div id="counter">00:00:00</div>
<div id="subtitle"></div>
<div id="completed-banner"></div>
<div id="connection-error" style="display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,0.7);color:#fff;padding:6px 16px;border-radius:8px;font-size:16px;font-weight:bold;z-index:999;">Desconectado del panel</div>
<div id="event-container"></div>

<script>
const API_STATE = '/api/overlay/live-timer/state';

let styles = {};
let popupColors = { add: '#00AAFF', subtract: '#FF4444' };
let completedStyle = { text: 'TIEMPO CUMPLIDO', color: '#FFD700', size: 48 };
let lastShownEventId = 0;

function applyStyles(el, styleObj) {
  el.style.fontSize = (styleObj.font_size_px || 48) + 'px';
  el.style.color = styleObj.font_color || '#FFFFFF';
  el.style.fontFamily = styleObj.font_family || 'Segoe UI, sans-serif';
  el.style.fontWeight = styleObj.bold ? 'bold' : 'normal';
}

function formatTime(seconds) {
  const total = Math.max(0, Math.floor(seconds));
  const DAY = 86400, HOUR = 3600, MIN = 60;
  const days = Math.floor(total / DAY);
  const rem = total % DAY;
  const hh = String(Math.floor(rem / HOUR)).padStart(2, '0');
  const mm = String(Math.floor((rem % HOUR) / MIN)).padStart(2, '0');
  const ss = String(rem % MIN).padStart(2, '0');
  if (days > 0) return days + (days === 1 ? ' dia ' : ' dias ') + hh + ':' + mm + ':' + ss;
  return hh + ':' + mm + ':' + ss;
}

function formatCompactDelta(d) {
  const abs = Math.abs(d);
  if (Number.isInteger(abs)) return (d >= 0 ? '+' : '') + d.toString();
  return (d >= 0 ? '+' : '') + (Math.round(d * 100) / 100).toString();
}

function showPopup(icon, label, delta) {
  const container = document.getElementById('event-container');
  const el = document.createElement('div');
  el.className = 'event-popup ' + (delta >= 0 ? 'add' : 'subtract');
  el.style.color = delta >= 0 ? popupColors.add : popupColors.subtract;
  const deltaText = formatCompactDelta(delta) + 's';
  const labelText = Math.abs(delta) === 1 ? icon + ' ' + label + ' ' + deltaText : icon + ' ' + deltaText;
  el.textContent = labelText;
  const counterSize = (styles.counter && styles.counter.font_size_px) || 120;
  el.style.fontSize = Math.max(28, Math.round(counterSize * 0.45)) + 'px';
  const existing = container.querySelectorAll('.event-popup');
  const step = Math.max(36, Math.round(counterSize * 0.45)) + 8;
  const offset = existing.length * step;
  el.style.top = 'calc(50% + ' + (counterSize * 0.55) + 'px + ' + offset + 'px)';
  container.appendChild(el);
  requestAnimationFrame(() => { el.classList.add('fade'); });
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
}

function styleEqual(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  return a.font_size_px === b.font_size_px
    && a.font_color === b.font_color
    && a.font_family === b.font_family
    && a.bold === b.bold;
}

function updateOverlay() {
  fetch(API_STATE)
    .then(r => r.json())
    .then(data => {
      const titleEl = document.getElementById('title');
      const counterEl = document.getElementById('counter');
      const subtitleEl = document.getElementById('subtitle');
      const bannerEl = document.getElementById('completed-banner');
      const errorEl = document.getElementById('connection-error');
      if (errorEl) errorEl.style.display = 'none';

      if (data.title !== undefined && titleEl.textContent !== data.title) {
        titleEl.textContent = data.title;
      }
      if (data.subtitle !== undefined && subtitleEl.textContent !== data.subtitle) {
        subtitleEl.textContent = data.subtitle;
      }

      if (!styleEqual(styles.title, data.titleStyle)) {
        applyStyles(titleEl, data.titleStyle || {font_size_px: 48, font_color: '#FFFFFF', font_family: 'Segoe UI, sans-serif', bold: true});
        styles.title = data.titleStyle;
      }
      if (!styleEqual(styles.counter, data.counterStyle)) {
        applyStyles(counterEl, data.counterStyle || {font_size_px: 120, font_color: '#00FF88', font_family: 'Segoe UI, monospace', bold: true});
        styles.counter = data.counterStyle;
      }
      if (!styleEqual(styles.subtitle, data.subtitleStyle)) {
        applyStyles(subtitleEl, data.subtitleStyle || {font_size_px: 32, font_color: '#AAAAAA', font_family: 'Segoe UI, sans-serif', bold: false});
        styles.subtitle = data.subtitleStyle;
      }

      if (data.popupAddColor) popupColors.add = data.popupAddColor;
      if (data.popupSubtractColor) popupColors.subtract = data.popupSubtractColor;

      if (data.completedText !== undefined) completedStyle.text = data.completedText;
      if (data.completedTextColor !== undefined) completedStyle.color = data.completedTextColor;
      if (data.completedTextSize !== undefined) completedStyle.size = data.completedTextSize;

      if (data.enabled === false) {
        counterEl.textContent = '--:--:--';
        counterEl.className = '';
        bannerEl.classList.remove('visible');
      } else if (data.paused) {
        counterEl.className = 'warning';
        bannerEl.classList.remove('visible');
      } else if (data.completed) {
        counterEl.textContent = '00:00:00';
        counterEl.className = 'completed';
        bannerEl.textContent = completedStyle.text;
        bannerEl.style.color = completedStyle.color;
        bannerEl.style.fontSize = completedStyle.size + 'px';
        bannerEl.classList.add('visible');
      } else {
        const formatted = data.format || formatTime(data.remainingSeconds);
        counterEl.textContent = formatted;
        if (data.remainingSeconds <= 10) {
          counterEl.className = 'danger';
        } else if (data.remainingSeconds <= 60) {
          counterEl.className = 'warning';
        } else {
          counterEl.className = '';
        }
        bannerEl.classList.remove('visible');
      }

      if (data.recentEvents) {
        data.recentEvents.forEach(ev => {
          if (!ev.id || ev.id > lastShownEventId) {
            showPopup(ev.icon, ev.label, ev.delta);
            if (ev.id) lastShownEventId = ev.id;
          }
        });
      }
    })
    .catch(() => {
      const errorEl = document.getElementById('connection-error');
      if (errorEl) errorEl.style.display = 'block';
    });
}

updateOverlay();
setInterval(updateOverlay, 500);
</script>
</body>
</html>
