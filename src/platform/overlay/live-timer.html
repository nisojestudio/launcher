<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Live Timer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent !important;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.6);
  text-align: center;
}
/* Preview mode: smaller fonts to fit in 200px iframe */
body.preview-mode #title     { font-size: 22px !important; margin-bottom: 2px !important; }
body.preview-mode #counter   { font-size: 52px !important; }
body.preview-mode #subtitle  { font-size: 14px !important; margin-top: 2px !important; }
body.preview-mode #completed-banner { font-size: 20px !important; margin-top: 4px !important; }

/* ---- Particle container ---- */
#particle-container {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.particle {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
}

/* ---- Effect: Glow (dynamic text-shadow set via JS) ---- */

/* ---- Effect: Wave Gradient ---- */
.effect-wave {
  background-clip: text !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent;
  background-size: 300% 300%;
  animation: waveAnim 3s ease-in-out infinite;
}
/* Wave yields to danger/warning/completed states */
#counter.effect-wave.danger {
  -webkit-text-fill-color: #ff4444 !important;
  background-clip: unset !important;
  -webkit-background-clip: unset !important;
  background: none !important;
}
#counter.effect-wave.warning {
  -webkit-text-fill-color: #ff8c00 !important;
  background-clip: unset !important;
  -webkit-background-clip: unset !important;
  background: none !important;
}
#counter.effect-wave.completed {
  -webkit-text-fill-color: #ff4444 !important;
  background-clip: unset !important;
  -webkit-background-clip: unset !important;
  background: none !important;
}
@keyframes waveAnim {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---- Effect: Pulse ---- */
.effect-pulse {
  animation: pulseEffect var(--pulse-speed, 1.5s) ease-in-out infinite;
}
@keyframes pulseEffect {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}

/* ---- Effect: Shake ---- */
.effect-shake-light {
  animation: shakeLight var(--shake-speed, 0.3s) ease-in-out infinite;
}
.effect-shake-normal {
  animation: shakeNormal var(--shake-speed, 0.2s) ease-in-out infinite;
}
.effect-shake-heavy {
  animation: shakeHeavy var(--shake-speed, 0.12s) ease-in-out infinite;
}
@keyframes shakeLight {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-3px); }
  75%      { transform: translateX(3px); }
}
@keyframes shakeNormal {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-5px) rotate(-0.5deg); }
  40%      { transform: translateX(5px) rotate(0.5deg); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}
@keyframes shakeHeavy {
  0%, 100% { transform: translateX(0); }
  15%      { transform: translateX(-8px) rotate(-1deg); }
  30%      { transform: translateX(8px) rotate(1deg); }
  45%      { transform: translateX(-6px) rotate(-0.5deg); }
  60%      { transform: translateX(6px) rotate(0.5deg); }
  75%      { transform: translateX(-4px); }
  90%      { transform: translateX(4px); }
}

/* ---- Confetti ---- */
#confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  top: -10px;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  opacity: 0;
  animation: confettiFall var(--fall-dur, 3s) ease-in forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  80%  { opacity: 0.8; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ---- Base elements ---- */
#title {
  font-size: 48px;
  margin-bottom: 8px;
  text-align: center;
  position: relative;
  z-index: 10;
}
#counter {
  font-size: 120px;
  font-weight: bold;
  font-family: 'Segoe UI', monospace;
  text-align: center;
  line-height: 1.1;
  transition: color 0.3s ease;
  position: relative;
  z-index: 10;
}
/* A1: warning/danger/completed no longer force a hardcoded color with
   !important. The operator's counter_font_color is now respected at all
   times; the state classes only attach an opt-in pulse animation when no
   effect is active. To color the last 10s in red, set counter_font_color
   to #ff4444 from the panel instead. */
#counter.warning { }
#counter.danger { }
#counter.completed { }
/* T2.5: danger/completed pulse is opt-in via .counter-danger-pulse and only
   applied by JS when no other counter_effect is active. Color is kept above. */
@keyframes pulseDanger {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
.counter-danger-pulse {
  animation: pulseDanger 0.5s ease-in-out infinite;
}
#subtitle {
  font-size: 32px;
  margin-top: 8px;
  text-align: center;
  position: relative;
  z-index: 10;
}
@keyframes pulse {
  50% { transform: scale(1.05); }
}
.event-popup {
  position: fixed;
  left: 0;
  right: 0;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 0 15px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
  opacity: 1;
  animation: none;
  pointer-events: none;
  z-index: 50;
}
.event-popup.add { color: #00AAFF; }
.event-popup.subtract { color: #FF4444; }
.event-popup.fade {
  animation: popFade 3s ease-out forwards;
}
@keyframes popFade {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.9); }
}
#completed-banner {
  display: none;
  font-weight: bold;
  text-align: center;
  margin-top: 16px;
  animation: pulse 0.6s ease-in-out infinite;
}
#completed-banner.visible { display: block; }
#preview-badge {
  display: none;
  position: fixed;
  top: 8px;
  right: 12px;
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.5);
  font-size: 12px;
  font-weight: bold;
  padding: 3px 10px;
  border-radius: 10px;
  letter-spacing: 1px;
  text-shadow: none;
  pointer-events: none;
  z-index: 999;
}
#preview-badge.visible { display: block; }
#subtitle.preview { opacity: 0.5; }

/* V2: Progress bar — sutil, sin fondo, solo borde inferior */
#progress-bar-container {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100vw;
  height: 4px;
  z-index: 20;
  pointer-events: none;
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: #00FF88;
  transition: width 0.5s ease-out, background 0.3s ease;
}
#progress-bar.warning { background: #ff8c00; }
#progress-bar.danger  { background: #ff4444; }
</style>
</head>
<body>
<!-- aria-live="polite" announces time updates to assistive tech without
     interrupting the user. The counter is wrapped in a role=region so
     it is announced as a discrete unit rather than as part of the page
     flow. -->
<div id="particle-container" aria-hidden="true"></div>
<div id="confetti-container" aria-hidden="true"></div>
<h1 id="title"></h1>
<div id="counter" role="region" aria-live="polite" aria-atomic="true" aria-label="Tiempo restante del temporizador">00:00:00</div>
<p id="subtitle"></p>
<div id="completed-banner" role="status" aria-live="assertive"></div>
<div id="connection-error" role="alert" style="display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,0,0,0.7);color:#fff;padding:6px 16px;border-radius:8px;font-size:16px;font-weight:bold;z-index:999;">Desconectado del panel</div>
<div id="preview-badge" aria-hidden="true">PREVIEW</div>
<div id="event-container" role="log" aria-live="polite" aria-relevant="additions" aria-label="Eventos recientes del temporizador"></div>
<!-- V2: barra de progreso sutil en el borde inferior -->
<div id="progress-bar-container" aria-hidden="true"><div id="progress-bar"></div></div>

<script>
// Detect preview mode (shown in panel iframe)
(function() {
  if (window.location.search.includes('preview=1')) {
    document.body.classList.add('preview-mode');
  }
})();

const API_STATE = '/api/overlay/live-timer/state';

let styles = {};
let popupColors = { add: '#00AAFF', subtract: '#FF4444' };
let completedStyle = { text: 'TIEMPO CUMPLIDO', color: '#FFD700', size: 48 };
let lastShownEventId = 0;
// T1.3: sessionId cursor — when it changes (arm/activate/restore) we reset the
// event cursor and clear cached effect state so the overlay re-syncs cleanly.
let currentSessionId = 0;
let effectState = null;      // { effects, glow, wave, pulse, shake, particles }
let particleContainer = null;
let particleColor_ = '#FFD700';
let particleCount_ = 15;
// T1.2: confetti is spawned at most once per completion cycle.
var confettiSpawned = false;
// T3.5: track particle removal timeouts so we can clear them before wiping DOM.
let particleTimeouts = [];
// T1.4: HTML5 audio refs owned by the overlay. C++ backend only ships config.
let tickAudio = null;
let addAudio = null;
let completeAudio = null;
let lastTickSecondPlayed = -1;

function clampVolume(v) {
  v = Number(v) || 0;
  if (v < 0) return 0;
  if (v > 1) return 1;
  return v;
}

/* ---- Compare two effect config objects ---- */
function effectConfigChanged(data) {
  const cur = {
    te: data.title_effect, ce: data.counter_effect, se: data.subtitle_effect,
    tg: !!data.title_glow_enabled, cg: !!data.counter_glow_enabled, sg: !!data.subtitle_glow_enabled,
    gc: data.glow_color, gi: data.glow_intensity_px,
    wc: data.wave_colors, ps: data.pulse_speed_s, si: data.shake_intensity,
    pe: !!data.particles_enabled, pc: data.particle_count, pcol: data.particle_color
  };
  if (effectState === null) { effectState = cur; return true; }
  for (const k in cur) {
    if (effectState[k] !== cur[k]) { effectState = cur; return true; }
  }
  return false;
}

/* ---- Effect: Clear effect classes from an element (keep base classes) ---- */
function clearEffectClasses(el) {
  el.classList.remove('effect-wave', 'effect-pulse',
    'effect-shake-light', 'effect-shake-normal', 'effect-shake-heavy');
  el.style.removeProperty('--pulse-speed');
  el.style.removeProperty('--shake-speed');
  el.style.textShadow = '';
  // T2.5: drop-shadow filter is set for glow; clear it so it doesn't leak.
  el.style.filter = '';
  el.style.background = '';
  el.style.webkitBackgroundClip = '';
  el.style.backgroundClip = '';
  el.style.webkitTextFillColor = '';
}

/* ---- Effect: Apply visual effects to an element ---- */
function applyEffects(el, effectName, glowEnabled, glowColor, glowIntensity,
                       waveColors, pulseSpeed, shakeIntensity) {
  clearEffectClasses(el);

  // T2.5: glow uses drop-shadow() on the whole element (filter) instead of
  // text-shadow so it renders on transparent-filled wave text correctly.
  // When glow is OFF we restore the default text-shadow halo for readability
  // and clear any leftover filter (already cleared by clearEffectClasses).
  if (glowEnabled && glowColor) {
    el.style.textShadow = '';
    el.style.filter =
      'drop-shadow(0 0 ' + glowIntensity + 'px ' + glowColor + ') ' +
      'drop-shadow(0 0 ' + (glowIntensity * 2) + 'px ' + glowColor + ')';
  } else {
    el.style.textShadow = '0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.6)';
  }

  // Main effect
  switch (effectName) {
    case 'wave':
      el.classList.add('effect-wave');
      if (waveColors) {
        el.style.background = 'linear-gradient(135deg, ' + waveColors.split(',').join(', ') + ')';
      }
      el.style.backgroundClip = 'text';
      el.style.webkitBackgroundClip = 'text';
      el.style.webkitTextFillColor = 'transparent';
      break;

    case 'pulse':
      el.classList.add('effect-pulse');
      el.style.setProperty('--pulse-speed', (pulseSpeed || 1.5) + 's');
      break;

    case 'shake':
      if (shakeIntensity === 'light') el.classList.add('effect-shake-light');
      else if (shakeIntensity === 'heavy') el.classList.add('effect-shake-heavy');
      else el.classList.add('effect-shake-normal');
      break;

    case 'glow':
      // Glow-only: just the text-shadow set above
      break;

    default:
      break;
  }
}

/* ---- Particle system (continuous, no reset) ---- */
(function injectParticleKeyframes() {
  const s = document.createElement('style');
  s.textContent =
    '@keyframes particleRise {\n' +
    '  0%   { transform: translateY(100vh) translateX(0); opacity: 0; }\n' +
    '  10%  { opacity: 0.7; }\n' +
    '  90%  { opacity: 0.2; }\n' +
    '  100% { transform: translateY(-10vh) translateX(var(--drift, 0px)); opacity: 0; }\n' +
    '}\n';
  document.head.appendChild(s);
})();

function spawnParticle(container, color) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 2 + Math.random() * 5;
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.background = color || '#FFD700';
  p.style.left = Math.random() * 100 + '%';
  p.style.bottom = '-5%';
  p.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + (color || '#FFD700');
  const duration = 6 + Math.random() * 8;
  const delay = Math.random() * 4;
  const drift = (Math.random() - 0.5) * 60;
  p.style.animation = 'particleRise ' + duration + 's ease-in ' + delay + 's forwards';
  p.style.setProperty('--drift', drift + 'px');
  container.appendChild(p);
  // T3.5: track the timeout so updateParticles can cancel pending removals
  // before wiping the container DOM, preventing late removeChild() on a node
  // that no longer belongs to the live document.
  const tid = setTimeout(function() {
    if (p.parentNode) p.parentNode.removeChild(p);
    const idx = particleTimeouts.indexOf(tid);
    if (idx >= 0) particleTimeouts.splice(idx, 1);
  }, (duration + delay) * 1000 + 100);
  particleTimeouts.push(tid);
}

/* ---- Confetti celebration ---- */
var _confettiTimeout = null;
function spawnConfetti() {
  var container = document.getElementById('confetti-container');
  if (!container) return;
  // Clear previous confetti
  container.innerHTML = '';
  if (_confettiTimeout) { clearTimeout(_confettiTimeout); _confettiTimeout = null; }
  var colors = ['#FF6B6B','#4ECDC4','#FFE66D','#FF4444','#00FF88','#FFD700','#FF69B4','#66CCFF','#AA66FF'];
  for (var i = 0; i < 60; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    var size = 4 + Math.random() * 8;
    piece.style.width = size + 'px';
    piece.style.height = (size * (0.4 + Math.random() * 0.8)) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.setProperty('--fall-dur', (2 + Math.random() * 3) + 's');
    piece.style.animationDelay = (Math.random() * 2) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    container.appendChild(piece);
  }
  // Auto-cleanup after animation
  _confettiTimeout = setTimeout(function() {
    if (container) container.innerHTML = '';
    _confettiTimeout = null;
  }, 6000);
}

function updateParticles(enabled, count, color) {
  particleColor_ = color || '#FFD700';
  particleCount_ = (count > 0 ? count : 15);
  if (!particleContainer) particleContainer = document.getElementById('particle-container');
  if (!particleContainer) return;

  // Clear existing interval if any
  if (particleContainer._timer) {
    clearInterval(particleContainer._timer);
    particleContainer._timer = null;
  }
  // T3.5: cancel pending particle removal timeouts so they don't fire after we
  // wipe the container innerHTML (which would otherwise throw on removeChild).
  particleTimeouts.forEach(clearTimeout);
  particleTimeouts = [];
  // Remove existing particles
  particleContainer.innerHTML = '';

  if (enabled && particleCount_ > 0) {
    // Initial burst — A4: tracked in particleTimeouts so updateParticles(false)
    // can cancel pending burst spawns before they fire on a cleared container.
    for (let i = 0; i < Math.min(particleCount_, 10); i++) {
      const tid = setTimeout(function() { spawnParticle(particleContainer, particleColor_); }, i * 200);
      particleTimeouts.push(tid);
    }
    // Continuous spawn
    particleContainer._timer = setInterval(function() {
      spawnParticle(particleContainer, particleColor_);
    }, Math.max(600, 3000 / particleCount_));
  }
}

function updateEffects(data) {
  if (!effectConfigChanged(data)) return; // skip if same config

  const titleEl = document.getElementById('title');
  const counterEl = document.getElementById('counter');
  const subtitleEl = document.getElementById('subtitle');

  applyEffects(titleEl,
    data.title_effect || 'none',
    data.title_glow_enabled,
    data.glow_color,
    data.glow_intensity_px || 8,
    data.wave_colors,
    data.pulse_speed_s,
    data.shake_intensity);

  applyEffects(counterEl,
    data.counter_effect || 'none',
    data.counter_glow_enabled,
    data.glow_color,
    data.glow_intensity_px || 8,
    data.wave_colors,
    data.pulse_speed_s,
    data.shake_intensity);

  applyEffects(subtitleEl,
    data.subtitle_effect || 'none',
    data.subtitle_glow_enabled,
    data.glow_color,
    data.glow_intensity_px || 8,
    data.wave_colors,
    data.pulse_speed_s,
    data.shake_intensity);

  // Particles (global)
  updateParticles(data.particles_enabled, data.particle_count || 15, data.particle_color);
}

function applyStyles(el, styleObj) {
  el.style.fontSize = (styleObj.font_size_px || 48) + 'px';
  el.style.color = styleObj.font_color || '#FFFFFF';
  el.style.fontFamily = styleObj.font_family || 'Segoe UI, sans-serif';
  el.style.fontWeight = styleObj.bold ? 'bold' : 'normal';
}

function formatTime(seconds) {
  // O1: NaN/inf guard — nunca mostrar "NaN" en el overlay.
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const total = Math.max(0, Math.floor(seconds));
  const DAY = 86400, HOUR = 3600, MIN = 60;
  const days = Math.floor(total / DAY);
  const rem = total % DAY;
  const hh = String(Math.floor(rem / HOUR)).padStart(2, '0');
  const mm = String(Math.floor((rem % HOUR) / MIN)).padStart(2, '0');
  const ss = String(rem % MIN).padStart(2, '0');
  if (days > 0) return days + (days === 1 ? ' dia ' : ' dias ') + hh + ':' + mm + ':' + ss;
  return hh + ':' + mm + ':' + ss;
}

function formatCompactDelta(d) {
  const abs = Math.abs(d);
  if (Number.isInteger(abs)) return (d >= 0 ? '+' : '') + d.toString();
  return (d >= 0 ? '+' : '') + (Math.round(d * 100) / 100).toString();
}

function showPopup(icon, label, delta) {
  const container = document.getElementById('event-container');
  // T3.4: keep the popup stack bounded so rapid event bursts don't pile up
  // DOM nodes and starve the layout.
  const MAX_POPUPS = 5;
  if (container && container.children.length >= MAX_POPUPS) {
    container.removeChild(container.firstChild);
  }
  const el = document.createElement('div');
  el.className = 'event-popup ' + (delta >= 0 ? 'add' : 'subtract');
  el.style.color = delta >= 0 ? popupColors.add : popupColors.subtract;
  const deltaText = formatCompactDelta(delta) + 's';
  // A13: show the label consistently for every event so the operator can
  // always tell what triggered the popup, regardless of the magnitude.
  // We only suppress the label for the auto-generated "manual" entry to
  // avoid duplicating the icon already in the manual marker.
  const showLabel = label !== 'manual';
  const labelText = showLabel ? icon + ' ' + label + ' ' + deltaText : icon + ' ' + deltaText;
  el.textContent = labelText;
  el.setAttribute('aria-label', (label || 'evento') + ' ' + deltaText);
  const counterSize = (styles.counter && styles.counter.font_size_px) || 120;
  el.style.fontSize = Math.max(28, Math.round(counterSize * 0.45)) + 'px';
  const existing = container.querySelectorAll('.event-popup');
  const step = Math.max(36, Math.round(counterSize * 0.45)) + 8;
  const offset = existing.length * step;
  el.style.top = 'calc(50% + ' + (counterSize * 0.55) + 'px + ' + offset + 'px)';
  container.appendChild(el);
  requestAnimationFrame(() => { el.classList.add('fade'); });
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
}

function styleEqual(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  return a.font_size_px === b.font_size_px
    && a.font_color === b.font_color
    && a.font_family === b.font_family
    && a.bold === b.bold;
}

// O5: moved to module scope so it isn't redefined on every poll.
function setCounterState(counterEl, state, effectName) {
  counterEl.classList.remove('danger', 'warning', 'completed', 'paused-state');
  const noEffect = !effectName || effectName === 'none';
  const wantPulse = (state === 'danger' || state === 'completed') && noEffect;
  if (state) counterEl.classList.add(state);
  if (wantPulse) counterEl.classList.add('counter-danger-pulse');
  else counterEl.classList.remove('counter-danger-pulse');
}

// V2: barra de progreso sutil (sin fondo, solo borde inferior)
function updateProgressBar(remainingSeconds, initialSeconds, maxTimeS) {
  const bar = document.getElementById('progress-bar');
  if (!bar) return;
  const total = maxTimeS > 0 ? maxTimeS : initialSeconds;
  if (total <= 0) { bar.style.width = '0%'; return; }
  const pct = Math.min(100, Math.max(0, (remainingSeconds / total) * 100));
  bar.style.width = pct + '%';
  // danger < 10%, warning < 30%
  bar.className = pct <= 10 ? 'danger' : pct <= 30 ? 'warning' : '';
}

// V5: bump animation en el contador cuando se agrega tiempo
let bumpTimer = null;
function triggerCounterBump() {
  const el = document.getElementById('counter');
  if (!el) return;
  if (bumpTimer) { clearTimeout(bumpTimer); el.style.transform = ''; }
  el.style.transition = 'transform 0.15s ease-out';
  el.style.transform = 'scale(1.08)';
  bumpTimer = setTimeout(function() {
    el.style.transform = 'scale(1)';
    bumpTimer = null;
  }, 150);
}

// T1.4: completion audio driven by JSON state. Empty path = silence (never a
// fallback beep). The backend ships only configuration; playback lives here.
function applySounds(data) {
  try {
    const compPath = data.on_complete_sound_path || '';
    if (data.completed && compPath) {
      if (!completeAudio || completeAudio._path !== compPath) {
        if (completeAudio) { try { completeAudio.pause(); } catch (e) {} }
        completeAudio = new Audio(compPath);
        completeAudio._path = compPath;
        completeAudio.volume = clampVolume(data.on_complete_volume);
        completeAudio.loop = !!data.on_complete_repeat;
      }
      try { completeAudio.play().catch(function () {}); } catch (e) {}
    } else {
      // State left completion (or path cleared): stop and release so the next
      // completion can replay cleanly.
      if (completeAudio) { try { completeAudio.pause(); } catch (e) {} completeAudio = null; }
    }

    const tickPath = data.tick_sound_path || '';
    const tickActive = data.running && !data.paused && !data.completed
        && tickPath && Number(data.remainingSeconds) <= 60;
    if (tickActive) {
      const sec = Math.floor(Number(data.remainingSeconds) || 0);
      if (sec >= 0 && sec !== lastTickSecondPlayed) {
        lastTickSecondPlayed = sec;
        if (!tickAudio || tickAudio._path !== tickPath) {
          if (tickAudio) { try { tickAudio.pause(); } catch (e) {} }
          tickAudio = new Audio(tickPath);
          tickAudio._path = tickPath;
        }
        tickAudio.volume = clampVolume(data.tick_sound_volume);
        try { tickAudio.currentTime = 0; } catch (e) {}
        try { tickAudio.play().catch(function () {}); } catch (e) {}
      }
    } else {
      lastTickSecondPlayed = -1;
    }
  } catch (e) {
    // Sounds are best-effort: never let audio errors break the overlay.
  }
}

// T1.4: add chime played when a new time-gaining event popup appears. Empty
// path = silence; the previous addAudio is stopped and replaced on path change.
function playAddSound(data) {
  try {
    const p = data.add_sound_path || '';
    if (!p) return;
    if (!addAudio || addAudio._path !== p) {
      if (addAudio) { try { addAudio.pause(); } catch (e) {} }
      addAudio = new Audio(p);
      addAudio._path = p;
    }
    addAudio.volume = clampVolume(data.add_sound_volume);
    try { addAudio.currentTime = 0; } catch (e) {}
    try { addAudio.play().catch(function () {}); } catch (e) {}
  } catch (e) {}
}

function updateOverlay() {
  fetch(API_STATE)
    .then(r => r.json())
    .then(data => {
      const titleEl = document.getElementById('title');
      const counterEl = document.getElementById('counter');
      const subtitleEl = document.getElementById('subtitle');
      const bannerEl = document.getElementById('completed-banner');
      const previewBadge = document.getElementById('preview-badge');
      const errorEl = document.getElementById('connection-error');
      if (errorEl) errorEl.style.display = 'none';

      // T1.3: detect session switches (arm/activate/restore) and reset the
      // event cursor + cached effect/glow state so the overlay re-syncs.
      if (data.sessionId !== undefined && data.sessionId !== currentSessionId) {
        currentSessionId = data.sessionId;
        lastShownEventId = 0;
        confettiSpawned = false;
        effectState = null;
      }
      // T1.2: confetti must not spawn again on a completion that just un-set.
      if (!data.completed) confettiSpawned = false;
      if (data.enabled === false) {
        confettiSpawned = false;
        effectState = null;
      }

      // Show preview badge when idle (not running, not completed, enabled)
      const isLive = data.running && !data.paused && !data.completed;
      const showPreview = !isLive && data.enabled !== false && !data.completed;
      if (previewBadge) {
        previewBadge.classList.toggle('visible', showPreview);
      }
      subtitleEl.classList.toggle('preview', showPreview);

      if (data.title !== undefined && titleEl.textContent !== data.title) {
        titleEl.textContent = data.title;
      }
      if (data.subtitle !== undefined && subtitleEl.textContent !== data.subtitle) {
        subtitleEl.textContent = data.subtitle;
      }

      if (!styleEqual(styles.title, data.titleStyle)) {
        applyStyles(titleEl, data.titleStyle || {font_size_px: 48, font_color: '#FFFFFF', font_family: 'Segoe UI, sans-serif', bold: true});
        styles.title = data.titleStyle;
      }
      if (!styleEqual(styles.counter, data.counterStyle)) {
        applyStyles(counterEl, data.counterStyle || {font_size_px: 120, font_color: '#00FF88', font_family: 'Segoe UI, monospace', bold: true});
        styles.counter = data.counterStyle;
      }
      if (!styleEqual(styles.subtitle, data.subtitleStyle)) {
        applyStyles(subtitleEl, data.subtitleStyle || {font_size_px: 32, font_color: '#AAAAAA', font_family: 'Segoe UI, sans-serif', bold: false});
        styles.subtitle = data.subtitleStyle;
      }

      if (data.popupAddColor) popupColors.add = data.popupAddColor;
      if (data.popupSubtractColor) popupColors.subtract = data.popupSubtractColor;

      if (data.completedText !== undefined) completedStyle.text = data.completedText;
      if (data.completedTextColor !== undefined) completedStyle.color = data.completedTextColor;
      if (data.completedTextSize !== undefined) completedStyle.size = data.completedTextSize;

      // Apply visual effects (sets effect classes only)
      updateEffects(data);

      // Set counter state class (preserves effect classes).
      const counterEffectName = data.counter_effect || 'none';

      if (data.enabled === false) {
        counterEl.textContent = '--:--:--';
        setCounterState(counterEl, null, counterEffectName);
        bannerEl.classList.remove('visible');
      } else if (data.paused) {
        counterEl.textContent = formatTime(data.remainingSeconds);
        setCounterState(counterEl, 'warning', counterEffectName);
        bannerEl.classList.remove('visible');
      } else if (data.completed) {
        counterEl.textContent = '00:00:00';
        setCounterState(counterEl, 'completed', counterEffectName);
        bannerEl.textContent = completedStyle.text;
        bannerEl.style.color = completedStyle.color;
        bannerEl.style.fontSize = completedStyle.size + 'px';
        bannerEl.classList.add('visible');
        // T1.2: confetti celebration (only once per completion cycle).
        if (!confettiSpawned) { spawnConfetti(); confettiSpawned = true; }
      } else {
        const formatted = data.format || formatTime(data.remainingSeconds);
        counterEl.textContent = formatted;
        if (data.remainingSeconds <= 10) {
          setCounterState(counterEl, 'danger', counterEffectName);
        } else if (data.remainingSeconds <= 60) {
          setCounterState(counterEl, 'warning', counterEffectName);
        } else {
          setCounterState(counterEl, null, counterEffectName);
        }
        bannerEl.classList.remove('visible');
      }

      // V2: actualizar barra de progreso
      updateProgressBar(data.remainingSeconds, data.initial_seconds || 300, data.max_time_s || 0);

      if (data.recentEvents) {
        data.recentEvents.forEach(ev => {
          if (!ev.id || ev.id > lastShownEventId) {
            showPopup(ev.icon, ev.label, ev.delta);
            if (ev.id) lastShownEventId = ev.id;
            // T1.4: play the add chime for genuine time gains only.
            if (ev.isAddition && ev.delta > 0) { playAddSound(data); triggerCounterBump(); }
          }
        });
      }

      // T1.4: completion + tick audio driven by JSON state from the backend.
      applySounds(data);

      // T3.3: success resets the backoff; the next poll is scheduled below.
      pollDelay = 500;
    })
    .catch(() => {
      const errorEl = document.getElementById('connection-error');
      if (errorEl) errorEl.style.display = 'block';
      // T3.3: exponential backoff capped at 5s when the panel is unreachable.
      pollDelay = Math.min(5000, pollDelay * 2);
    });
  // T3.3: chain the next poll regardless of success/failure (replaces setInterval).
  schedulePoll();
}

// T3.3: poll scheduling with adaptive backoff — never use setInterval.
let pollDelay = 500;
function schedulePoll() { setTimeout(updateOverlay, pollDelay); }

schedulePoll();

// A12: cancel pending timeouts and audio on unload so popups and ticks
// don't fire against a torn-down DOM / Audio element. Browsers throttle or
// ignore setTimeout after the page is being torn down, but cancelTimeout is
// cheap and keeps behaviour deterministic during hot reloads.
window.addEventListener('beforeunload', function() {
  particleTimeouts.forEach(clearTimeout);
  particleTimeouts = [];
  if (_confettiTimeout) { clearTimeout(_confettiTimeout); _confettiTimeout = null; }
  if (particleContainer && particleContainer._timer) {
    clearInterval(particleContainer._timer);
    particleContainer._timer = null;
  }
  if (tickAudio) { try { tickAudio.pause(); } catch (e) {} tickAudio = null; }
  if (addAudio) { try { addAudio.pause(); } catch (e) {} addAudio = null; }
  if (completeAudio) { try { completeAudio.pause(); } catch (e) {} completeAudio = null; }
});
</script>
</body>
