name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat")
          & (Join-Path $vcpkgRoot "vcpkg.exe") install --triplet x64-windows --x-manifest-root="$PWD" --clean-after-build
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install bridge Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/bridge_py/requirements.txt

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset release

      - name: Run C++ tests
        shell: pwsh
        run: |
          ctest --preset release --output-on-failure -E nlp3_bridge_python_tests

      - name: Run bridge Python tests
        shell: pwsh
        run: |
          python -m unittest discover -s tools/bridge_py/tests -t tools/bridge_py -v

      - name: Package portable
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\package_windows.ps1 -SkipBuild

      - name: Verify packaged host has no Debug CRT
        shell: pwsh
        run: |
          dumpbin /dependents .\dist\NisojeStudio\NisojeStudio.exe | Tee-Object -FilePath .\build\release\package_dependents.txt
          $forbidden = @('MSVCP140D.dll', 'VCRUNTIME140D.dll', 'VCRUNTIME140_1D.dll', 'ucrtbased.dll')
          foreach ($dll in $forbidden) {
            if (Select-String -Path .\build\release\package_dependents.txt -SimpleMatch $dll) {
              throw "Debug CRT dependency detected in packaged host: $dll"
            }
          }

      - name: Verify portable prerequisites note
        shell: pwsh
        run: |
          $requirements = '.\dist\NisojeStudio\PORTABLE_REQUIREMENTS.txt'
          if (-not (Test-Path $requirements)) {
            throw "Portable prerequisites note missing: $requirements"
          }
          if (-not (Select-String -Path $requirements -SimpleMatch 'Microsoft Visual C++ Redistributable x64')) {
            throw "Portable prerequisites note does not mention Microsoft Visual C++ Redistributable x64"
          }
